api_platform:
    title: Hello API Platform
    version: 1.0.0

    # 🔥 AQUI ESTA LA MAGIA: Le decimos dónde buscar los #[ApiResource]
    mapping:
        paths:
            - '%kernel.project_dir%/src/Entity'
            - '%kernel.project_dir%/src/Pms/Entity'
            - '%kernel.project_dir%/src/Message/Entity'
            - '%kernel.project_dir%/src/Travel/Entity'
            - '%kernel.project_dir%/src/Cotizacion/Entity'
            # Sin esta línea los #[ApiFilter] de Operacion no se compilan a servicios:
            # AttributeFilterPass sólo recorre los directorios listados aquí, así que los
            # filtros se ignoran en silencio y las colecciones salen sin filtrar.
            - '%kernel.project_dir%/src/Operacion/Entity'
            # Descomenta estas líneas si luego quieres exponer APIs de estos módulos:
            # - '%kernel.project_dir%/src/Exchange/Entity'


    # ==========================================================================
    # EXCEPCIONES DE NEGOCIO → 422, no 500
    #
    # Las reglas del PMS se defienden lanzando `DomainException` desde los listeners de
    # Doctrine (moneda bloqueada, cargo de canal no borrable, depósito automático...). Sin
    # este mapeo, API Platform las trataba como fallo interno: el operador veía
    # "Internal Server Error" en vez del motivo, el log se llenaba de CRITICAL por
    # situaciones perfectamente normales, y no había forma de distinguir una regla de
    # negocio de una caída de verdad.
    #
    # 422 (Unprocessable Entity) es lo que corresponde: la petición está bien formada, es
    # el estado del dominio el que la rechaza. El mensaje de la excepción llega al cliente,
    # así que TIENE que estar escrito para el operador — y lo está.
    # ==========================================================================
    exception_to_status:
        DomainException: 422

    eager_loading:
        max_joins: 100

    defaults:
        stateless: false
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']

    formats:
        jsonld: ['application/ld+json']
        json: ['application/json']
        html: ['text/html']
        multipart: ['multipart/form-data']