framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            # 1. Debes definir el transporte 'sync' aquí
            # El DSN 'sync://' le dice a Symfony que ejecute el handler inmediatamente
            sync: 'sync://'

            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    use_notify: true
                    # Cada cuánto mira el worker si venció un mensaje DIFERIDO. Estaba en
                    # 60 s para no machacar la BD, pero la espera de ráfaga del autorresponder
                    # (AGENT_IA_ESPERA_RAFAGA) va con DelayStamp: con 60 s, una espera de 20
                    # tardaba hasta 80 en dispararse y el huésped se quedaba mirando el chat.
                    # 2 s es el compromiso: responde como un chat y consulta la mitad de veces
                    # que el defecto de Symfony, que es 1 s.
                    check_delayed_interval: 2000
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'
            # sync: 'sync://'

        routing:
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async

            App\Exchange\Dispatch\RunExchangeTaskDispatch: async

            App\Pms\Dispatch\ProcessBeds24WebhookDispatch: async

            # Sin esta ruta el dispatch se maneja SÍNCRONO, y como quien lo lanza es un
            # postPersist/postUpdate de Doctrine, el router del Agent acababa corriendo
            # DENTRO de un flush: flush anidado, persist de la respuesta dentro de un
            # postPersist y un `em->refresh()` a media transacción. Con IA en esa rama sería
            # peor todavía — bloquearía el webhook de Meta varios segundos dentro de la
            # transacción, y Meta reintenta los webhooks lentos, así que el huésped recibiría
            # la respuesta duplicada. Ver docs/Mensajeria.md §9.
            App\Agent\Dispatch\ProcessInboundIntentDispatch: async

            # Mismo motivo que el de arriba: lo lanza un postPersist de Doctrine y hace
            # una llamada de red a la IA. Síncrono bloquearía el webhook dentro del flush.
            App\Message\Dispatch\GenerarResumenDispatch: async


            # Route your messages to the transports
            # 'App\Message\YourMessage': async
