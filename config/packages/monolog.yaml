monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        # Canal propio del cálculo compartido (PHP → Node). Existe para poder ver una llamada
        # lenta o rota SIN reproducirla: cada invocación deja contrato, nº de entradas y ms.
        # Los fallos van además a `error.log`, que es donde se miran en producción.
        - dominio

when@dev:
    monolog:
        handlers:
            # Rotado, no `stream`: el `dev.log` sin rotar llegó a 3,6 GB. Es el
            # mismo fallo que ya estaba corregido en prod para `deprecations-prod.log`,
            # pero dev seguía con el handler del esqueleto de Symfony.
            main:
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                max_files: 5
                channels: ["!event"]
            # uncomment to get logging in your browser
            # you may have to allow bigger header sizes in your Web server configuration
            #firephp:
            #    type: firephp
            #    level: info
            #chromephp:
            #    type: chromephp
            #    level: info
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        channels: [deprecation]

        handlers:
            # ------------------------------------------------------------------
            # ⚠️ AQUÍ YA NO HAY `fingers_crossed`, y es a propósito.
            #
            # Antes todo iba a un `prod.log` con `action_level: error`: los INFO y
            # los WARNING se quedaban en el buffer y SOLO se escribían si en la
            # misma petición ocurría además un error. Un comando que termina bien
            # no dejaba una sola línea.
            #
            # Eso hizo indiagnosticables flujos enteros — el resumen IA falló seis
            # veces seguidas contra un log vacío. Cuando el trabajo del día a día
            # es asíncrono y no explota, el buffer esconde justo lo que hay que
            # mirar. Se cambia por dos ficheros separados y rotados.
            # ------------------------------------------------------------------

            # El día a día: qué hizo el sistema. Se lee para auditar, no para
            # apagar fuegos. Rotación corta porque crece rápido.
            # `stream`, no `rotating_file`: la rotación la hace logrotate
            # (/etc/logrotate.d/openperu, con `copytruncate`). Tener los dos
            # rotando era el bug — Monolog inventaba un nombre base nuevo cada
            # día y logrotate trataba cada uno como una serie independiente con
            # derecho a sus propias 30 rotaciones. Nadie limpiaba lo del otro.
            info:
                type: stream
                path: '%kernel.logs_dir%/info.log'
                level: info
                formatter: monolog.formatter.json
                # Fuera el ruido de infraestructura: `event` y `doctrine` a nivel
                # info son miles de líneas por petición que tapan lo de la app.
                # Las deprecaciones ya tienen su propio fichero.
                channels: ["!deprecation", "!event", "!doctrine"]

            # Solo lo que rompe. Fichero corto, con traza, y se guarda más tiempo:
            # un error se investiga días después, un info casi nunca.
            error:
                type: stream
                path: '%kernel.logs_dir%/error.log'
                level: error
                formatter: monolog.formatter.json
                include_stacktraces: true
                channels: ["!deprecation"]

            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!deprecation"]

            # Las deprecaciones aparte. El handler es un servicio propio que
            # descarta el ruido de vendor/ (api-platform repetía una sola
            # deprecación 736 MB) y deja pasar las de symfony/*, que son las
            # únicas accionables. Ver src/Logging/FiltroDeprecacionesVendor.php.
            # El fichero lo rota logrotate, igual que info.log y error.log.
            deprecation_stream:
                type: service
                id: App\Logging\FiltroDeprecacionesVendor
                channels: [deprecation]
                bubble: false