twig:
    default_path: '%kernel.project_dir%/templates'
    globals:

        pax_host_url: '%pax_host_url%'
        pax_book_guide_url: '%pax_book_guide_url%'
        travel_segmento_imagenes_path: '%travel.path.segmento_imagenes%' #como ejemplo


        numero_default: "%numero_default%"

        # Web pública (templates/front/). Ver docs/WebPublica.md.
        front_host: '%app.host.front%'
        front:
            marca: '%front.marca%'
            razon_social: '%front.razon_social%'
            nombre_comercial: '%front.nombre_comercial%'
            ruc: '%front.ruc%'
            direccion: '%front.direccion%'
            correo: '%front.correo%'
            whatsapp: '%front.whatsapp%'
            telefono_visible: '%front.telefono_visible%'
            alojamiento_url: '%front.alojamiento_url%'
            alojamiento_nombre: '%front.alojamiento_nombre%'
        colores:
            lila: "#954e8d"
            azul_acero: "#016c8d"
            verde_oscuro: "#1B6129"
            verde_claro: "#58954e"
            azul_oscuro: "#003d72"
            naranja: "#F68A39"
            rojo_oscuro: "#710000"

when@test:
    twig:
        strict_variables: true
