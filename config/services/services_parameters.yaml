# config/services/services_paramneters.yaml
parameters:

    #sonata legacy
    locale: es
    router.request_context.host: oweb.openperu.pe
    router.request_context.scheme: https

    #applicationnew
    app.default_language: '%env(resolve:APP_DEFAULT_LANGUAGE)%'

    google_maps_key: '%env(resolve:GOOGLE_MAPS_KEY)%'
    google_translate_key: '%env(resolve:GOOGLE_TRANSLATE_KEY)%'
    google_translate_auth: '%env(json:base64:GOOGLE_TRANSLATE_CREDENTIALS_B64)%'

    mailer_sender_email: '%env(resolve:MAILER_SENDER_EMAIL)%'
    mailer_sender_name: '%env(resolve:MAILER_SENDER_EMAIL)%'
    mailer_control_email: '%env(resolve:MAILER_CONTROL_EMAIL)%'
    mailer_alert_receivers: '%env(resolve:MAILER_ALERT_RECEIVERS)%'
    numero_default: '%env(resolve:NUMERO_DEFAULT)%'

    app.public_dir: '%kernel.project_dir%/public'

    app.host.oweb: '%env(OWEB_HOST)%'
    app.host.panel: '%env(PANEL_HOST)%'
    app.host.api: '%env(API_HOST)%'
    app.host.front: '%env(FRONT_HOST)%'
    app.host.pax: '%env(PAX_HOST)%'
    app.host.util: '%env(UTIL_HOST)%'

    pax_host_url: '%env(PAX_HOST_URL)%'
    util_host_url: '%env(UTIL_HOST_URL)%'
    panel_host_url: '%env(PANEL_HOST_URL)%'
    api_host_url: '%env(API_HOST_URL)%'

    pax_book_guide_url: '%env(PAX_HOST_URL)%/huesped/reserva'
    pax_book_guide_url_nd: 'huesped/reserva'
    # ⚠️ El catálogo de tours vive en `/catalogo/{localizador}` — ver `pax/src/router/index.ts`.
    # Antes esto apuntaba a `/catalog/tours`, una ruta que NO EXISTE en pax: caía en el
    # comodín `:pathMatch(.*)` y el huésped veía un «no encontrado». Iba en el botón «Ver Tours»
    # de `welcome_airbnb` y en `tours_catalog_url` de cualquier plantilla, así que llevaba
    # tiempo mandando gente a una página muerta sin que fallara nada de forma visible.
    #
    # El localizador está aquí y no en cada plantilla porque hoy hay un solo catálogo. Cuando
    # haya varios —«Oferta Lima-Paracas», «Paquetes completos»— esto pasa a ser un campo de la
    # plantilla y este parámetro se queda como el catálogo por defecto.
    pax_catalogo_localizador: '2W883T'
    pax_catalog_url: '%env(PAX_HOST_URL)%/catalogo/%pax_catalogo_localizador%'
    pax_catalog_url_nd: 'catalogo/%pax_catalogo_localizador%'
    pax_book_unidad_url: '%env(PAX_HOST_URL)%/huesped/unidad'


    pms.path.huesped_docs: '/carga/pms/pms_reserva_huesped/documento'
    pms.path.huesped_firmas: '/carga/pms/pms_reserva_huesped/firmas'
    pms.path.galeria_images: '/carga/pms/pms_guia_item_galeria/images'
    pms.path.unidad_images: '/carga/pms/pms_unidad/images'
    message.path.message_attachments: '/carga/message/message_attachment/file'
    travel.path.segmento_imagenes: '/carga/travel/segmentos'
    cotizacion.path.file_documentos: '/carga/cotizacion/documentos'
    travel.path.proveedor_galeria: '/carga/travel/proveedor/galeria'
    travel.path.proveedor_servicio_galeria: '/carga/travel/proveedor_servicio/galeria'