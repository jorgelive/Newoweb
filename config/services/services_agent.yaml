# config/services/services_agent.yaml
parameters:
    # ⚠️ **El valor por defecto de una variable OPCIONAL va aquí, no sólo en `.env`.**
    #
    # Producción arranca de `.env.local.php` y **no lee `.env`**, así que una variable nueva
    # declarada sólo ahí NO EXISTE en el servidor: `%env(resolve:…)%` revienta al compilar el
    # contenedor con «Environment variable not found», y eso no es un fallo del comando que la
    # usa — es el contenedor entero, o sea **todas** las peticiones, en el siguiente
    # `cache:clear --env=prod`.
    #
    # Pasó el 09/09/2026 al añadir `AGENT_IA_VISION_MODELO`: la web seguía en pie sólo porque el
    # contenedor cacheado era anterior. Con `env(default:…)` la ausencia significa lo mismo que
    # el valor vacío —«usa el modelo de `GOOGLE_AI_MODEL`»—, que es justo lo que ya documenta.
    agent_ia_vision_modelo: ''
    # Esfuerzo de Claude (`low`…`max`). Vacío = el del modelo, que en Sonnet 5.5 es `high`: piensa
    # cientos de tokens en cada respuesta de chat. Ver AnthropicClientFactory::esfuerzo().
    anthropic_esfuerzo: ''
    # `1` añade al prompt de Claude los ajustes de chat (no volver sobre lo contestado, que el último
    # mensaje valga solo). Ver AnthropicEngine::AJUSTES_DE_CHAT.
    anthropic_ajustes_chat: ''

services:

    _defaults:
        autowire: true
        autoconfigure: true

    # Todo motor queda etiquetado por el simple hecho de implementar la interfaz. Añadir un
    # proveedor es crear su carpeta en src/Agent/Provider/ y sus dos variables de entorno:
    # no hay que tocar este archivo para registrarlo.
    _instanceof:
        App\Agent\Conversation\AgentEngineInterface:
            tags: ['app.agent_engine']

    App\Agent\:
        resource: '../../src/Agent/'
        exclude:
            - '../../src/Agent/Dto/'
            - '../../src/Agent/Entity/'

    # =========================
    # controllers del módulo Pms
    # (fuera de src/Controller/)
    # =========================
    App\Agent\Controller\:
        resource: '../../src/Agent/Controller/'
        autowire: true
        autoconfigure: true
        tags:
            - 'controller.service_arguments'

    # =========================
    # Inteligencia artificial
    # =========================
    # Las claves y los modelos se resuelven UNA vez aquí. Con la clave vacía el motor se
    # declara no disponible y el registro elige otro: un entorno a medio configurar degrada,
    # no rompe.
    App\Agent\Provider\Anthropic\AnthropicClientFactory:
        arguments:
            $apiKey: '%env(resolve:ANTHROPIC_API_KEY)%'
            $modelo: '%env(resolve:ANTHROPIC_MODEL)%'
            $modelos: '%env(resolve:ANTHROPIC_MODELS)%'
            $esfuerzo: '%env(default:anthropic_esfuerzo:ANTHROPIC_EFFORT)%'
            $ajustes: '%env(default:anthropic_ajustes_chat:ANTHROPIC_AJUSTES_CHAT)%'

    # DeepSeek es compatible con la API de OpenAI, así que el cliente es el mismo HttpClient de
    # siempre y no hace falta SDK. Su caché es AUTOMÁTICO por prefijo: no hay marcas que poner,
    # sólo un prefijo que no puede cambiar. Ver DeepSeekClient::firmaDeCache().
    App\Agent\Provider\DeepSeek\DeepSeekClient:
        arguments:
            $apiKey: '%env(resolve:DEEPSEEK_API_KEY)%'
            $modelo: '%env(resolve:DEEPSEEK_MODEL)%'
            $modelos: '%env(resolve:DEEPSEEK_MODELS)%'

    App\Agent\Provider\Google\GoogleAIClient:
        arguments:
            $apiKey: '%env(resolve:GOOGLE_AI_API_KEY)%'
            $modelo: '%env(resolve:GOOGLE_AI_MODEL)%'
            $modelos: '%env(resolve:GOOGLE_AI_MODELS)%'
            $razonamiento: '%env(resolve:GOOGLE_AI_THINKING)%'

    # ── VISIÓN ────────────────────────────────────────────────────────────────────────────
    # Leer una imagen y devolver datos con la forma que se pida. NO pasa por el motor de
    # conversación —ver el porqué en `LectorDeImagenInterface`— y NO usa los tramos de potencia:
    # leer una MRZ es una CAPACIDAD (multimodal + salida estructurada), no «más cabeza», así que
    # el modelo se fija aquí y no se hereda de `AGENT_IA_POTENCIA_*`.
    #
    # Vacío = el de `GOOGLE_AI_MODEL`. Se separa porque un modelo bueno redactando puede no leer
    # un documento, y son documentos de identidad: el día que se cambie el modelo del chat, esto
    # no debe moverse de rebote.
    App\Agent\Vision\GoogleLectorDeImagen:
        arguments:
            $modelo: '%env(default:agent_ia_vision_modelo:AGENT_IA_VISION_MODELO)%'

    App\Agent\Vision\LectorDeImagenInterface: '@App\Agent\Vision\GoogleLectorDeImagen'

    # LA FRONTERA con los proveedores. Quién contesta cada llamada lo decide el registro con
    # AGENT_IA_PROVEEDOR (y el desplegable del panel, por petición): nada por encima de
    # AgentEngineInterface conoce ningún SDK ni ninguna API.
    App\Agent\Conversation\AgentEngineRegistry:
        arguments:
            $motores: !tagged_iterator app.agent_engine
            $proveedorPorDefecto: '%env(resolve:AGENT_IA_PROVEEDOR)%'

    # QUÉ MODELO ATIENDE CADA PASO. Las tres claves van en la forma «proveedor:modelo» y pueden
    # apuntar a proveedores distintos entre sí. Vacías, todo se atiende como antes de que este
    # mecanismo existiera. Ver App\Agent\Conversation\PotenciaRequerida.
    App\Agent\Conversation\SelectorDePotencia:
        arguments:
            $alta: '%env(resolve:AGENT_IA_POTENCIA_ALTA)%'
            $media: '%env(resolve:AGENT_IA_POTENCIA_MEDIA)%'
            $baja: '%env(resolve:AGENT_IA_POTENCIA_BAJA)%'

    # El triaje corre en TODOS los mensajes entrantes, así que tiene su propio interruptor: si
    # sale mal se apaga sin desplegar y el agente vuelve al camino de siempre.
    App\Agent\Triage\Triaje:
        arguments:
            $habilitado: '%env(bool:AGENT_IA_TRIAJE)%'
            $potencia: '%env(resolve:AGENT_IA_TRIAJE_POTENCIA)%'

    # El autoresponder del huésped arranca APAGADO a propósito: es el único componente que
    # escribe a un cliente real sin que nadie lo revise. Ver docs/Mensajeria.md §9.
    App\Agent\Service\AiConversationProcessor:
        arguments:
            $habilitado: '%env(bool:AGENT_IA_AUTORESPONDER)%'


    # 🔒 Dónde se guarda lo que el agente ENSEÑÓ antes de escribir (`GuardiaDeSkills`).
    #
    # ⚠️ **No en `cache.app`**: vive en `var/cache/prod/pools/`, y cada despliegue la borra con
    # `cache:clear`. El 17/10/2026 un despliegue cayó entre una previsualización y su «sí»: la
    # guardia no encontró lo enseñado, no aplicó y volvió a enseñarlo — confirmar dos veces.
    # En `var/estado/` sobrevive a los despliegues; las ACL por defecto de `var/` dejan escribir
    # a `www-data` y a `ubuntu`. Una entrada por usuario (o conversación) y skill, que se pisa.
    agente.previsualizaciones:
        class: Symfony\Component\Cache\Adapter\FilesystemAdapter
        arguments:
            $namespace: 'previsualizaciones'
            $defaultLifetime: 0
            $directory: '%kernel.project_dir%/var/estado'
