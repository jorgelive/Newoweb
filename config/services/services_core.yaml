# config/services/services_core.yaml
services:

    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            # Ahora cualquier constructor que pida $owebHost recibirá este valor automáticamente
            $publicDir: '%app.public_dir%'
            $apiHost: '%app.host.api%'
            $owebHost: '%app.host.oweb%'
            $panelHost: '%app.host.panel%'
            $googleTranslateCredentials: '%google_translate_auth%'
            $sunatApiToken: '%env(SUNAT_API_TOKEN)%'
            $baseLanguage: '%app.default_language%'


    App\:
        resource: ../../src/
        exclude:
            - ../../src/DependencyInjection/
            - ../../src/Entity/
            - ../../src/Kernel.php
            - ../../src/pms/Service/Beds24/Sync/SyncContextScope.php
            - ../../src/Pms/
            - ../../src/Calendar/
            - ../../src/Exchange/
            - ../../src/Message/

    Symfony\Component\Serializer\Normalizer\DateTimeNormalizer:
        arguments:
            $defaultContext:
                datetime_format: 'Y-m-d\TH:i:s'

    Google\Cloud\Translate\V3\Client\TranslationServiceClient:
        arguments:
            $options:
                credentials: '%google_translate_auth%'





    # ------------------------------------------------------------------
    # Logging de deprecaciones (ver docs/Logging.md)
    #
    # El handler real es un `stream` de nombre fijo: la rotación la hace
    # logrotate en el servidor, no Monolog. Tener los dos rotando el mismo
    # fichero fue lo que generó 109 ficheros y 862 MB en agosto de 2026.
    # ------------------------------------------------------------------
    app.logging.deprecaciones_stream:
        class: Monolog\Handler\StreamHandler
        arguments:
            $stream: '%kernel.logs_dir%/deprecations-prod.log'
            $level: !php/const Monolog\Level::Info

    App\Logging\FiltroDeprecacionesVendor:
        arguments:
            $interno: '@app.logging.deprecaciones_stream'
