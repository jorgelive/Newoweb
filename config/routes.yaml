# config/routes.yaml
#controllers:
#    resource: ../src/Controller/
#    type: annotation

security_global:
    resource: ../src/Controller/SecurityController.php
    type: attribute

# FRONT (web / CMS)
front_controllers:
    resource: ../src/Front/Controller/
    type: attribute
    host: '%app.host.front%'

# PAX
pax_controllers:
    resource: ../src/Pax/Controller/
    type: attribute
    host: '%app.host.pax%'

util_controllers:
    resource: ../src/Util/Controller/
    type: attribute
    host: '%app.host.util%'

# API (ajax, ical, calendar, etc.)
api_controllers:
    resource: ../src/Api/Controller/
    type: attribute
    host: '%app.host.api%'

# Calendar (módulo nuevo)
calendar_controllers:
    resource: ../src/Calendar/Controller/
    type: attribute
    host: '%app.host.api%'

# webhook beds24 (módulo nuevo)
beds24_webhook_controllers:
    resource: ../src/Pms/Controller/Webhook/
    type: attribute
    host: '%app.host.api%'

# webhook whatsapp_meta (módulo nuevo)
whatsapp_meta_webhook_controllers:
    resource: ../src/Message/Controller/Webhook/
    type: attribute
    host: '%app.host.api%'

# webhook (módulo nuevo)
message_api_controllers:
    resource: ../src/Message/Controller/Api/
    type: attribute
    host: '%app.host.api%'

# API (calendario SPA de reservas — módulo nuevo)
pms_api_controllers:
    resource: ../src/Pms/Controller/Api/
    type: attribute
    host: '%app.host.api%'

# Asistente interno del panel (IA). Ojo: el host de api NO está en `access_control`, así que
# cae en PUBLIC_ACCESS — la protección de este endpoint es el #[IsGranted('ROLE_USER')] del
# propio controlador, no el firewall. No lo quites de ahí.
agent_api_controllers:
    resource: ../src/Agent/Controller/Api/
    type: attribute
    host: '%app.host.api%'

# FINANZAS — cobros por pasarela. Los tres bloques van al host de API porque los consumen
# la SPA `util` (API interna), la SPA `pax` (página pública de pago) e Izipay (IPN).
#
# Ojo: el host de api NO está en `access_control`, así que todo aquí cae en PUBLIC_ACCESS.
# Es LO QUE SE QUIERE en `Publico/` y `Webhook/` —Izipay y el huésped no tienen sesión—,
# pero significa que `Api/` se protege sólo con sus #[IsGranted]. No los quites.
finanzas_api_controllers:
    resource: ../src/Finanzas/Controller/Api/
    type: attribute
    host: '%app.host.api%'

# OPERACIÓN — previsualizar y enviar la Orden de Servicio al proveedor.
#
# ⚠️ Un controlador aquí NO tiene rutas hasta que su directorio se declara en este archivo:
# cada módulo trae el suyo. Se descubre con un 404 en una ruta que `debug:router` no lista, y
# no con un error — que es peor, porque parece un fallo del front.
#
# Mismo aviso que los de arriba: el host de api cae en PUBLIC_ACCESS, así que la protección es
# el #[IsGranted] del propio controlador. No lo quites.
operacion_api_controllers:
    resource: ../src/Operacion/Controller/Api/
    type: attribute
    host: '%app.host.api%'

# OPERACIÓN — la orden que ve el PROVEEDOR, por enlace y sin sesión.
#
# Va al host de PAX porque es el público: el proveedor no tiene cuenta ni entra al panel, y ese
# host es el que ya sirve páginas a gente de fuera (la vista cliente de una cotización).
#
# ⚠️ Aquí NO hay `IsGranted` a propósito — la llave es el token de 32 caracteres. Por eso el
# documento no lleva importes ni datos del cliente: un enlace se reenvía.
operacion_publico_controllers:
    resource: ../src/Operacion/Controller/Publico/
    type: attribute
    host: '%app.host.pax%'

finanzas_publico_controllers:
    resource: ../src/Finanzas/Controller/Publico/
    type: attribute
    host: '%app.host.api%'

finanzas_webhook_controllers:
    resource: ../src/Finanzas/Controller/Webhook/
    type: attribute
    host: '%app.host.api%'

# Panel (Easyadmin)
panel_controllers:
    resource: ../src/Panel/Controller/
    type: attribute
    host: '%app.host.panel%'

# Admin (Oweb / legacy controlado)
oweb_controllers:
    resource: ../src/Oweb/Controller/
    type: attribute
    host: '%app.host.oweb%'

kernel:
    resource: ../src/Kernel.php
    type: attribute


