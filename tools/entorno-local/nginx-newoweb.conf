# Newoweb en local: nginx + php-fpm, COPIADO del bloque de producción (/etc/nginx/sites-enabled/openperu).
#
# ⚠️ Es una PLANTILLA: `instalar.sh` sustituye {{RAIZ}}, {{CERTS}} y {{FPM}} y la deja en
# /opt/homebrew/etc/nginx/servers/. No se edita la copia instalada: se edita ésta y se reinstala.
#
# Sustituye a MAMP PRO (17/09/2026), que servía lo mismo con Apache. Mismos dominios y mismo puerto
# que antes, así que no hay que tocar ningún .env ni la config de Vite.

# 8888 en claro → 8890 con TLS, como tenía MAMP.
server {
    listen 8888;
    server_name newapi.openperu.test newoweb.openperu.test panel.openperu.test pax.openperu.test util.openperu.test;
    return 301 https://$host:8890$request_uri;
}

server {
    listen 8890 ssl;
    http2 on;
    server_name newapi.openperu.test newoweb.openperu.test panel.openperu.test pax.openperu.test util.openperu.test;

    root {{RAIZ}}/public;
    index index.php;

    ssl_certificate     {{CERTS}}/openperu.test.crt;
    ssl_certificate_key {{CERTS}}/openperu.test.key;

    # Igual que producción: una subida de más de 64 MB falla en los dos sitios o en ninguno.
    client_max_body_size 64M;

    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    location /.well-known/mercure {
        proxy_pass http://127.0.0.1:3000/.well-known/mercure;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 🔑 Los documentos privados (pasaportes, DNI) se sirven con X-Accel-Redirect a esta ruta
    # INTERNA: nunca se pueden pedir directamente. Sin este bloque, en local fallan en silencio.
    location /_privado/ {
        internal;
        alias {{RAIZ}}/var/documentos/;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:{{FPM}};
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
        internal;
    }

    error_log /opt/homebrew/var/log/nginx/newoweb_error.log;
    access_log /opt/homebrew/var/log/nginx/newoweb_access.log;
}
